name: Reconstruct and build TEST14

on:
  push:
    paths:
      - 'upload_trigger/READY'

permissions:
  contents: write

jobs:
  build-test14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified upload payload
        shell: bash
        run: |
          set -euo pipefail
          count=$(find staging_parts -maxdepth 1 -type f -name 'part_*' | wc -l)
          test "$count" -eq 55
          cat staging_parts/part_* | base64 -d > /tmp/test14-payload.tar.xz
          echo "9436427c63429bc1c2b6da3b6c5fdb8171aa9787427cb1d1d1089ddb02e22ce6  /tmp/test14-payload.tar.xz" | sha256sum -c -
          mkdir -p /tmp/test14-payload
          tar -xJf /tmp/test14-payload.tar.xz -C /tmp/test14-payload

      - name: Reconstruct synthetic TEST81 M-Flasher template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/test14-payload/template/TEST81-preserved.bin").read_bytes()
          assert len(p) == 0x71000
          head, tail = p[:0x4000], p[0x4000:]
          base = head + b"\xff" * (0x93000 - 0x4000) + tail
          assert len(base) == 0x100000
          import hashlib
          assert hashlib.sha256(base).hexdigest() == "6c84ce2986aa752f840bb7ed40663711ceb5f215de835b592fcf361782cb1ae4"
          out = Path("/tmp/test14-payload/source/reference/FM1-PolyWavetable-TEST81-M-Flasher.bin")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base)
          PY

      - name: Download pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/test14-payload/source
          mkdir -p toolchain
          curl -fL --retry 4 --retry-delay 2             https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz             -o toolchain/jieli-linux-toolchains-20260730.1.tar.xz
          echo "a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd  toolchain/jieli-linux-toolchains-20260730.1.tar.xz" | sha256sum -c -

      - name: Build TEST14
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/test14-payload/source
          # The application region of the template is replaced in full.  This
          # synthetic template retains the exact boot/config/calibration/settings
          # bytes, so authorize its independently verified synthetic-base hash.
          sed -i 's/ead915f71caff82d92e090da0b6912e910774fff950153fd4976f935937e6940/6c84ce2986aa752f840bb7ed40663711ceb5f215de835b592fcf361782cb1ae4/' tools/make_mflasher.py
          bash build.sh
          echo "0965e6b6d28b88f04847d16cb5d19808bc873dd4efbc81d54abbc3f82bbaf2bb  release/FM1-BassStation-TEST14-M-Flasher.bin" | sha256sum -c -
          echo "7a06540235f9a7f7ad1dc6d5abf7cbe59573756bc833793657e2ace42ea629c9  release/FM1-BassStation-TEST14.fwsc" | sha256sum -c -

      - name: Publish TEST14 files into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf TEST14
          mkdir -p TEST14
          cp /tmp/test14-payload/source/release/FM1-BassStation-TEST14-M-Flasher.bin TEST14/
          cp /tmp/test14-payload/source/release/FM1-BassStation-TEST14.fwsc TEST14/
          # Package the original unmodified uploaded source tree (without downloaded toolchain/build outputs).
          rm -rf /tmp/test14-source-publish
          cp -a /tmp/test14-payload/source /tmp/test14-source-publish
          rm -rf /tmp/test14-source-publish/build-toolchain                  /tmp/test14-source-publish/toolchain                  /tmp/test14-source-publish/app/build                  /tmp/test14-source-publish/release                  /tmp/test14-source-publish/reference/FM1-PolyWavetable-TEST81-M-Flasher.bin
          # Restore the original pinned TEST81 hash in the published source.
          sed -i 's/6c84ce2986aa752f840bb7ed40663711ceb5f215de835b592fcf361782cb1ae4/ead915f71caff82d92e090da0b6912e910774fff950153fd4976f935937e6940/' /tmp/test14-source-publish/tools/make_mflasher.py
          tar -C /tmp/test14-source-publish -cJf TEST14/FM1-BassStation-TEST14-Source-and-Tests.tar.xz .
          mkdir -p TEST14/source
          cp -a /tmp/test14-source-publish/. TEST14/source/
          cat > TEST14/SHA256SUMS.txt <<'EOF'
          0965e6b6d28b88f04847d16cb5d19808bc873dd4efbc81d54abbc3f82bbaf2bb  FM1-BassStation-TEST14-M-Flasher.bin
          7a06540235f9a7f7ad1dc6d5abf7cbe59573756bc833793657e2ace42ea629c9  FM1-BassStation-TEST14.fwsc
          EOF
          cat > TEST14/README.md <<'EOF'
          # FM1 Bass Station TEST14

          GitHub-rebuilt and hash-verified TEST14 artifacts.

          - `FM1-BassStation-TEST14-M-Flasher.bin` — 1 MiB M-Flasher image.
          - `FM1-BassStation-TEST14.fwsc` — standard firmware package.
          - `FM1-BassStation-TEST14-Source-and-Tests.tar.xz` — source/test package.
          - `source/` — browsable source tree.

          The workflow refuses to publish unless both firmware hashes exactly match the locally validated TEST14 release.
          EOF

      - name: Commit verified artifacts and remove staging data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging_parts upload_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified FM1 Bass Station TEST14"
          git push
