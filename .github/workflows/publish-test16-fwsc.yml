name: Publish TEST16 FWSC

on:
  push:
    paths:
      - 'fwsc16_trigger/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified TEST16 payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find fwsc16_parts -maxdepth 1 -type f -name 'part_*' | wc -l)" -eq 11
          cat fwsc16_parts/part_* | base64 -d > /tmp/test16-min.tar.xz
          echo "54ec21effd8951fc268ec062e01d2796f34fde0531b414556fa6b54f1b70a495  /tmp/test16-min.tar.xz" | sha256sum -c -
          mkdir -p /tmp/test16
          tar -xJf /tmp/test16-min.tar.xz -C /tmp/test16
      - name: Build and verify FWSC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TEST16
          python3 /tmp/test16/base/tools/fm1pkg_make.py             /tmp/test16/app/build/bassstation.bin             /tmp/test16/app/build/loader/ota.bin             TEST16/FM1-BassStation-TEST16.fwsc             --product FM-1_17000207             --sdk /tmp/test16/build-deps/sdk
          echo "8dbb4bade26cffa2c7f2b3e714336bf412df5c53c7d7460db57d67b68d81cdb1  TEST16/FM1-BassStation-TEST16.fwsc" | sha256sum -c -
      - name: Commit verified TEST16 FWSC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fwsc16_parts fwsc16_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified FM1 Bass Station TEST16 FWSC"
          git push
