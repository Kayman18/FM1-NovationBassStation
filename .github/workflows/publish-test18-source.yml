name: Publish TEST18 source

on:
  push:
    paths:
      - 'TEST18/FM1-BassStation-TEST18-Project-Source.tar.xz'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify TEST18 project source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "662850b75dc58c69063de1ace935e27605a5a8a86166d5c6da23bcbb13280b39  TEST18/FM1-BassStation-TEST18-Project-Source.tar.xz" | sha256sum -c -
          tar -tJf TEST18/FM1-BassStation-TEST18-Project-Source.tar.xz >/dev/null

      - name: Publish browsable TEST18 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf TEST18/source
          mkdir -p TEST18/source
          tar -xJf TEST18/FM1-BassStation-TEST18-Project-Source.tar.xz -C TEST18/source --strip-components=1
          printf '%s\n' \
            'FM1 Bass Station TEST18 project source' \
            '' \
            'TEST18 adds the 240x240 Bass Station multipage GUI and approved custom splash.' \
            'The TEST17 synth engine, factory/user banks, preset browser mappings and 303 sequencer behavior are preserved.' \
            'Host regression and target firmware builds pass; hardware flash testing was not performed in this pass.' \
            > TEST18/SOURCE-NOTES.txt
          printf '%s  %s\n' \
            '662850b75dc58c69063de1ace935e27605a5a8a86166d5c6da23bcbb13280b39' \
            'FM1-BassStation-TEST18-Project-Source.tar.xz' \
            > TEST18/SOURCE-SHA256SUMS.txt

      - name: Commit verified TEST18 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEST18/source TEST18/SOURCE-NOTES.txt TEST18/SOURCE-SHA256SUMS.txt
          git commit -m "Publish browsable FM1 Bass Station TEST18 source"
          git push
