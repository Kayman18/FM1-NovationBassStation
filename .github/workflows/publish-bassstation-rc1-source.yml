name: Publish Bass Station RC1 source

on:
  push:
    paths:
      - 'RC1/FM1-BassStation-RC1-Project-Source.tar.xz'
      - 'RC1/PUBLISH-SOURCE'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RC1 source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "dcff2c0fabea32b47a5d9d1e123c64bab62be39bc367271d2f9714412a2390b8  RC1/FM1-BassStation-RC1-Project-Source.tar.xz" | sha256sum -c -
          tar -tJf RC1/FM1-BassStation-RC1-Project-Source.tar.xz >/dev/null

      - name: Publish browsable RC1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf RC1/source
          mkdir -p RC1/source
          tar -xJf RC1/FM1-BassStation-RC1-Project-Source.tar.xz -C RC1/source --strip-components=1
          echo "FM1 Bass Station RC1 project source" > RC1/SOURCE-NOTES.txt
          echo "" >> RC1/SOURCE-NOTES.txt
          echo "SELECT is Filter Cutoff and ALGO is Filter Resonance outside the SEL preset browser." >> RC1/SOURCE-NOTES.txt
          echo "Normal pages use the full 2x2 four-control layout with the old lower footer removed." >> RC1/SOURCE-NOTES.txt
          echo "Splash hold is doubled to 800 ms and the release is marked RC1." >> RC1/SOURCE-NOTES.txt
          echo "dcff2c0fabea32b47a5d9d1e123c64bab62be39bc367271d2f9714412a2390b8  FM1-BassStation-RC1-Project-Source.tar.xz" > RC1/SOURCE-SHA256SUMS.txt

      - name: Commit browsable source
        shell: bash
        run: |
          set -euo pipefail
          rm -f RC1/PUBLISH-SOURCE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A RC1
          git commit -m "Publish browsable FM1 Bass Station RC1 source"
          git push
