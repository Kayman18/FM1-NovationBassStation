name: Export TEST15 source artifact

on:
  push:
    paths:
      - 'export15_trigger/READY'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: test15-source
          path: TEST15/FM1-BassStation-TEST15-Project-Source.tar.xz
          if-no-files-found: error
          retention-days: 1
