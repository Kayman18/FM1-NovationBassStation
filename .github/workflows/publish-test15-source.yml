name: Publish TEST15 source

on:
  push:
    paths:
      - 'source15_trigger/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify TEST15 project source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find source15_lean_parts -maxdepth 1 -type f -name 'part_*' | wc -l)
          test "$count" -eq 12
          cat source15_lean_parts/part_* | base64 -d > /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz
          echo "1c06a44a0b3763de8b6caa714824bdeb8ecab07aa963c71919cfdbbb33a481c1  /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz" | sha256sum -c -
          test "$(tar -tJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz | wc -l)" -eq 31

      - name: Publish archive and browsable source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf TEST15/source
          mkdir -p TEST15/source
          cp /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz TEST15/
          tar -xJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz -C TEST15/source --strip-components=1
          cat > TEST15/SOURCE-NOTES.txt <<'EOF'
FM1 Bass Station TEST15 project source

Contains the TEST15 application, Bass Station engine, build-support tools,
source tests, and current TEST15 documentation.

The generic FM1 base/ framework and SDK support are byte-identical to TEST14,
so they are intentionally not duplicated here. Compiled outputs and toolchains
are also omitted.
EOF
          printf '%s  %s
'             "1c06a44a0b3763de8b6caa714824bdeb8ecab07aa963c71919cfdbbb33a481c1"             "FM1-BassStation-TEST15-Project-Source.tar.xz"             > TEST15/SOURCE-SHA256SUMS.txt

      - name: Commit verified TEST15 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source15_parts source15_lean_parts source15_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified FM1 Bass Station TEST15 source"
          git push
