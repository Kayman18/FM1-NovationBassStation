name: Publish TEST15 source

on:
  push:
    paths:
      - 'source15_trigger/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify TEST15 project source
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object source15_parts/part_000)" = "0448a7c27f1ce67c6afb4fe8127fdf86a75e422f"
          test "$(git hash-object source15_parts/part_001)" = "45cfdd78ef61c76f3d856ff05f8223b1f117f2f4"
          test "$(git hash-object source15_parts/part_002)" = "ef36843990015984aef2605a83051e1d577c3a35"
          test "$(git hash-object source15_parts/part_005)" = "33b1c974f186a74f8ad364273c9a1073ab382f4b"
          test "$(git hash-object source15_parts/part_006)" = "22a3a1b0a25b4ca569b666a9d2818743230a99f0"
          test "$(git hash-object source15_parts/part_010)" = "c05056b0cdc596ed37f8947b66e2345b22782c32"

          for spec in             003_0:1d05c79f291f4156bf2621588fa13e866db0fbf7             003_1:d093cb967dc8ce75d7bcc3938c8df40b0a92cc66             003_2:6f966dce24500bac184cd5a4d219261a3dff5f67             004_0:cdb31e30f4f9c68c93c9a8db66a09412e0ea3e30             004_1:fbbf86d8d3932ed02e9cff69b3a724319c20ce6d             004_2:4a2df720cea104b6ca6a62f761cb12c70b3e6dd0             007_0:95a74b7a4626ddfbfab2f993f916256ab15280ba             007_1:2561a982ad0dcd4dcd08698140cf699fcdd2ff75             007_2:01d85cf97ef7634a8203883864dec2153ed07b70             008_0:0425116b3889911ed43d3ccbe0bd35ba50a48f29             008_1:f782fa0431acd4ebaac0f41644ad144cf44fdd5d             008_2a:98947e8dda5109e7e0d89d3b90c8f9f1ebd9a8cc             008_2b:be86d09a3ca8e9824989ed05b6ff5bb39325e23c             009_0:f54b4b3b34dafff159de857ce59f9c7d245f7189             009_1:c2ff1c61c564021d9ef46bf9770d4da5b8afb225             009_2:6cd87b3b8288832c6214620d332505563d294ddd
          do
            p="${spec%%:*}"
            h="${spec#*:}"
            test "$(git hash-object "source15_fix/$p")" = "$h"
          done

          {
            cat source15_parts/part_000
            cat source15_parts/part_001
            cat source15_parts/part_002
            cat source15_fix/003_0 source15_fix/003_1 source15_fix/003_2
            cat source15_fix/004_0 source15_fix/004_1 source15_fix/004_2
            cat source15_parts/part_005
            cat source15_parts/part_006
            cat source15_fix/007_0 source15_fix/007_1 source15_fix/007_2
            cat source15_fix/008_0 source15_fix/008_1 source15_fix/008_2a source15_fix/008_2b
            cat source15_fix/009_0 source15_fix/009_1 source15_fix/009_2
            cat source15_parts/part_010
          } | base64 -d > /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz

          echo "d5762b8bdc3c63acce653563da9a357bb863aeb14670ca85b17c4b6bc444a332  /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz" | sha256sum -c -
          test "$(tar -tJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz | wc -l)" -eq 80

      - name: Publish archive and browsable source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf TEST15/source
          mkdir -p TEST15/source
          cp /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz TEST15/
          tar -xJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz -C TEST15/source --strip-components=1
          printf '%s\n' \
            'FM1 Bass Station TEST15 project source' \
            '' \
            'Contains the TEST15 application, Bass Station engine, build-support tools,' \
            'source tests, current documentation, research notes and bundled project assets.' \
            '' \
            'Compiled outputs and toolchains are omitted. The generic FM1 base framework' \
            'used by this build is unchanged from TEST14 and is not duplicated in this' \
            'project-source archive.' \
            > TEST15/SOURCE-NOTES.txt
          printf '%s  %s\n'             "d5762b8bdc3c63acce653563da9a357bb863aeb14670ca85b17c4b6bc444a332"             "FM1-BassStation-TEST15-Project-Source.tar.xz"             > TEST15/SOURCE-SHA256SUMS.txt

      - name: Commit verified TEST15 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source15_parts source15_fix source15_safe source15_lean_parts source15_head2 source15_tail source15_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified FM1 Bass Station TEST15 project source"
          git push
