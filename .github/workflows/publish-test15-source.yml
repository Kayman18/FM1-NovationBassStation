name: Publish TEST15 source

on:
  push:
    paths:
      - 'source15_trigger/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify TEST15 project source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find source15_safe -maxdepth 1 -type f -name 'part_*' | wc -l)
          test "$count" -eq 27
          cat source15_safe/part_* | base64 -d > /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz
          echo "d5762b8bdc3c63acce653563da9a357bb863aeb14670ca85b17c4b6bc444a332  /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz" | sha256sum -c -
          test "$(tar -tJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz | wc -l)" -eq 80

      - name: Publish archive and browsable source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf TEST15/source
          mkdir -p TEST15/source
          cp /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz TEST15/
          tar -xJf /tmp/FM1-BassStation-TEST15-Project-Source.tar.xz -C TEST15/source --strip-components=1
          cat > TEST15/SOURCE-NOTES.txt <<'EOF'
FM1 Bass Station TEST15 project source

Contains the TEST15 application, Bass Station engine, build-support tools,
source tests, current documentation, research notes and bundled project assets.

Compiled outputs and toolchains are omitted. The generic FM1 base framework
used by this build is unchanged from TEST14 and is not duplicated in this
project-source archive.
EOF
          printf '%s  %s\n' \
            "d5762b8bdc3c63acce653563da9a357bb863aeb14670ca85b17c4b6bc444a332" \
            "FM1-BassStation-TEST15-Project-Source.tar.xz" \
            > TEST15/SOURCE-SHA256SUMS.txt

      - name: Commit verified TEST15 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source15_parts source15_safe source15_lean_parts source15_head2 source15_tail source15_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified FM1 Bass Station TEST15 project source"
          git push
