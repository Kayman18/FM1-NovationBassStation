name: Publish FM1 Bass Station 1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.0.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c 1.0-SHA256SUMS.txt
          assets=(
            FM1-BassStation-1.0.fwsc
            FM1-BassStation-1.0-Web-Editor.zip
            FM1-BassStation-1.0-Project-Source.tar.xz
            FM1-BassStation-1.0-Source-Validation.json
            1.0-SHA256SUMS.txt
            recovery/FM1-BassStation-1.0-CLEAN-INSTALL-M-Flasher.bin
          )
          if gh release view v1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0 "${assets[@]}" --title "FM1 Bass Station 1.0" --notes-file FM1-BassStation-1.0-Release-Notes.md --target "$GITHUB_SHA" --latest
